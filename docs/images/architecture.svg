<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#182338"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2 2L10 6L2 10V2Z" fill="#F97316"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="42" font-weight="800">Raiders Vault Architecture</text>
  <text x="72" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="20">ASP.NET Core MVC application with service-layer business logic, EF Core persistence, and Cloud Run deployment readiness.</text>

  <g filter="url(#shadow)">
    <rect x="88" y="180" width="210" height="106" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="193" y="224" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Browser Client</text>
    <text x="193" y="256" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial" font-size="15">Razor UI + Static Assets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="392" y="180" width="250" height="106" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="517" y="224" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="22" font-weight="700">ASP.NET Core MVC</text>
    <text x="517" y="256" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial" font-size="15">Routing • Sessions • Validation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="762" y="180" width="250" height="106" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="887" y="224" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Controllers</text>
    <text x="887" y="256" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial" font-size="15">Loadouts • Quests • Blueprints</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="192" y="390" width="250" height="112" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="317" y="435" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Application Services</text>
    <text x="317" y="467" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial" font-size="15">Recommendations • Reports</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="514" y="390" width="250" height="112" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="639" y="435" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="22" font-weight="700">Entity Framework Core</text>
    <text x="639" y="467" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial" font-size="15">DbContext • LINQ • Models</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="836" y="390" width="250" height="112" rx="18" fill="url(#card)" stroke="#334155"/>
    <text x="961" y="435" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="22" font-weight="700">SQLite Database</text>
    <text x="961" y="467" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial" font-size="15">Seeded operational data</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="392" y="580" width="420" height="82" rx="18" fill="#1E293B" stroke="#475569"/>
    <text x="602" y="615" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial" font-size="21" font-weight="700">Deployment Layer</text>
    <text x="602" y="643" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Arial" font-size="15">Dockerfile • Google Cloud Run • Health Check</text>
  </g>

  <path d="M298 233H392" stroke="#F97316" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M642 233H762" stroke="#F97316" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M887 286C887 334 784 352 717 390" stroke="#F97316" stroke-width="4" marker-end="url(#arrow)" fill="none"/>
  <path d="M762 446H836" stroke="#F97316" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M514 446H442" stroke="#F97316" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M639 502V580" stroke="#F97316" stroke-width="4" marker-end="url(#arrow)"/>

  <g opacity="0.75">
    <rect x="72" y="636" width="220" height="34" rx="17" fill="#0F172A" stroke="#334155"/>
    <text x="182" y="659" text-anchor="middle" fill="#FDBA74" font-family="Segoe UI, Arial" font-size="14" font-weight="700">Portfolio-ready architecture</text>
  </g>
</svg>
