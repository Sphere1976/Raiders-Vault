name: Fullstack CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  dotnet:
    name: ASP.NET Core build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore RaidersVault.csproj
      - run: dotnet build RaidersVault.csproj --configuration Release --no-restore
      - run: dotnet test tests/RaidersVault.Tests/RaidersVault.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage"

  next:
    name: Next.js build and Playwright install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/raiders-vault-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  spring:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Services/liveops-spring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test

  graphql:
    name: GraphQL BFF build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway/graphql-bff
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn test

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/aws/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate

  kubernetes:
    name: Kubernetes and Helm validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - run: kubectl kustomize infra/kubernetes/base
      - run: helm lint infra/helm/raiders-vault

  mobile:
    name: Mobile TypeScript check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/raiders-vault-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
