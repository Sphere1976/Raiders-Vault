name: Raiders Vault CI

on:
  push:
    branches: [ main, master, Working ]
  pull_request:
    branches: [ main, master, Working ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore RaidersVault.sln

      - name: Build release configuration
        run: dotnet build RaidersVault.sln --configuration Release --no-restore

      - name: Publish deployable artifact
        run: dotnet publish RaidersVault.csproj --configuration Release --output ./artifacts/publish --no-build

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: raiders-vault-publish
          path: ./artifacts/publish
