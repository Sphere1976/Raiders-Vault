name: Feature request
description: Propose a product or engineering improvement for Raiders Vault.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be considered done?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - ASP.NET Core MVC
        - Next.js Frontend
        - Spring Boot Service
        - AWS / Infrastructure
        - Testing / CI
        - Product / UX
    validations:
      required: true
