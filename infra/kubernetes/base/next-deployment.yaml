apiVersion: apps/v1
kind: Deployment
metadata:
  name: raiders-vault-next
  namespace: raiders-vault
  labels:
    app.kubernetes.io/name: raiders-vault-next
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: raiders-vault-next
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raiders-vault-next
    spec:
      containers:
        - name: next
          image: ghcr.io/example/raiders-vault-next:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: raiders-vault-config
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
