apiVersion: apps/v1
kind: Deployment
metadata:
  name: raiders-vault-mvc
  namespace: raiders-vault
  labels:
    app.kubernetes.io/name: raiders-vault-mvc
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: raiders-vault-mvc
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raiders-vault-mvc
    spec:
      containers:
        - name: mvc
          image: ghcr.io/example/raiders-vault-mvc:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: raiders-vault-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
